# ------------------------ Venganza entre jugadores --------------------
revenge-title: "&4&l⚔ VENGANZA"
revenge-subtitle: "&c{killer} te ha matado. Tienes &f{time} &cpara vengarte."
revenge-started: "{prefix}&c{killer} &7te ha matado. Tienes &f{time} &7para vengarte: si lo matas, le robas &c{lives} ❤&7."
revenge-warning: "{prefix}&e{victim} &7buscará venganza durante &f{time}&7. Si te mata, te robará un corazón."
revenge-broadcast: "&4⚔ &f{victim} &7busca venganza contra &c{killer}&7."
revenge-reminder: "{prefix}&7Aún tienes una venganza pendiente contra &c{killer} &7({time})."
revenge-fulfilled-avenger: "{prefix}&a¡Venganza cumplida! &7Le robaste &c{lives} ❤ &7a &f{target}&7. Ahora tienes &f{total}&7/&f{max_lives}&7."
