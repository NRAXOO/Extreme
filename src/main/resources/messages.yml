usage-lives: "{prefix}&7Uso: &f/vidas <fijar|dar|quitar> <jugador> <cantidad> &7| &f/vidas reiniciar <jugador> &7| &f/vidas lista"
ban-message:
  - "&cHas perdido todas tus vidas."
  - "&cHas sido eliminado del servidor."

