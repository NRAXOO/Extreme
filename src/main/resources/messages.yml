revenge-done-subtitle: "&7Has robado un corazón a &f{target}"
revenge-done-broadcast: "&4⚔ &f{avenger} &7se ha vengado de &c{target}&7."
revenge-expired: "{prefix}&7Se acabó el tiempo: ya no puedes vengarte de &c{killer}&7."
revenge-expired-bar: "&7Tu venganza ha expirado."
revenge-status: "{prefix}&7Venganza pendiente contra &c{killer}&7. Tiempo restante: &f{time}&7. Recompensa: &c{lives} ❤&7."
revenge-none: "{prefix}&7No tienes ninguna venganza pendiente."
revenge-hunted: "{prefix}&e{count} &7jugador(es) buscan vengarse de ti."
revenge-cancelled: "{prefix}&aVenganza de &f{player} &acancelada."
