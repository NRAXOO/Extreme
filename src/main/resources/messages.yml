# ======================================================================
#  EXTREME - messages.yml
#  Todos los textos del plugin. Colores: &c, &l... y hex &#RRGGBB.
#  Una clave con "" (vacío) silencia ese mensaje.
#  Los textos de {llaves} son placeholders que reemplaza el plugin.
# ======================================================================
prefix: "&8[&cExtreme&8] &r"

states:
  "on": "&aACTIVADO"
  "off": "&cDESACTIVADO"

# ---------------------------- Generales -------------------------------
no-permission: "{prefix}&cNo tienes permiso para hacer esto."
player-only: "{prefix}&cSolo un jugador puede usar este comando."
player-not-found: "{prefix}&cNo se encontró al jugador &f{player}&c (debe haber entrado al servidor alguna vez)."
invalid-number: "{prefix}&c'&f{value}&c' no es un número válido."
reload-ok: "&a✔ Configuración recargada correctamente."
reload-error: "&c✖ Error en {file} en la línea {line}."
reload-error-noline: "&c✖ Error en {file}: {error}"
reload-kept-old: "&7Se mantiene la configuración anterior. Corrige el archivo y vuelve a usar &f/extreme reload&7."
help:
  - "&8&m          &r &cExtreme &7v{version} &8&m          "
  - "&c/panel &8- &fPanel (todo se configura desde ahí, por módulos)"
  - "&c/pvp &7| &c/vidas &7| &c/dia &7| &c/venganza"
  - "&c/pesadilla &8- &fModo Pesadilla (jefes, eventos, zonas)"
  - "&c/extreme recargar &7| &cmodulos &7| &cmodulo <clave> <activar|desactivar>"

# ------------------------------- PVP ----------------------------------
pvp-enabled: "&c⚔ &l¡EL PVP HA SIDO ACTIVADO!"
pvp-disabled: "&a🛡 &l¡EL PVP HA SIDO DESACTIVADO!"
pvp-already-on: "{prefix}&eEl PVP ya está activado."
pvp-already-off: "{prefix}&eEl PVP ya está desactivado."
pvp-random-enabled: "{prefix}&aPVP aleatorio activado."
pvp-random-disabled: "{prefix}&cPVP aleatorio desactivado."
pvp-status:
  - "&8&m          &r &c⚔ Estado del PVP &8&m          "
  - "&7PVP: {state}"
  - "&7PVP aleatorio: {random}"
  - "&7Próximo cambio aleatorio en: &f{timer}"
usage-pvp: "{prefix}&7Uso: &f/pvp <activar|desactivar|estado|aleatorio activar|desactivar>"
usage-pvp-random: "{prefix}&7Uso: &f/pvp aleatorio <activar|desactivar>"

# ------------------------------ Vidas ---------------------------------
lives-lost: "&cHas perdido una vida. Te quedan &f{lives}&c."
